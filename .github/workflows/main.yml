name: Github Actions
on:
  push:
    branches: '**'
  workflow_dispatch:
jobs:
  code-quality:
    # Preserve the check name required by main's branch protection.
    name: code-quality (20)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Read the Emscripten version
        id: emsdk
        run: echo "version=$(sed -n 's/^emsdk = "\(.*\)"$/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk.outputs.version }}
      - run: npm ci
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify agent-tool
        run: |
          npm run agent-tool -- --version
          npm run agent-tool -- config show
          npm run agents:check
      - name: Check for binary files
        run: sh scripts/checks/checkBinaryFiles.sh --all
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck
      - run: npm run lint
      - run: npm run lint:md
      - run: npm run lint:shell
      - run: npm run test
  web:
    name: web
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Read the Emscripten version
        id: emsdk
        run: echo "version=$(sed -n 's/^emsdk = "\(.*\)"$/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk.outputs.version }}
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-artifacts
          path: artifacts/playwright/
          retention-days: 14
  detox-macos:
    # Preserve the check name required by main's branch protection.
    name: detox-macos (20, 3.3)
    runs-on: macos-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - name: Cache CocoaPods
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile.lock', 'Gemfile.lock') }}
      - name: Cache DerivedData
        uses: actions/cache@v6.1.0
        with:
          path: ios/build
          key: ${{ runner.os }}-derived-data-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-ccache
      - run: npm ci
      - name: Install AppleSimUtils
        run: |
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install wix/brew/applesimutils
      - name: Install ImageMagick
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install imagemagick
      - name: run pod install
        working-directory: ./ios
        run: bundle exec pod install
      - run: npx detox build --configuration ios.release
      - name: Create iOS simulator
        # Detox boots it headless (ios.release.ci). Booting it in the background
        # earlier competes with installs and the build for the runner's CPU and
        # disk, and measured slower overall.
        run: xcrun simctl create rn-sandbox com.apple.CoreSimulator.SimDeviceType.iPhone-16
      - run: npx detox test --configuration ios.release.ci --record-videos all
      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: detox-artifacts-ios
          path: artifacts/
          retention-days: 14
  detox-android:
    # Preserve the check name required by main's branch protection.
    name: detox-android (20)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      # Before anything runs Gradle: setup-gradle won't restore its cache once
      # ~/.gradle exists.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          # Generates the gitignored wrapper jar (scripts/ensureGradleWrapper.sh).
          gradle-version: '9.4.1'
      - run: npm ci
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y imagemagick librsvg2-bin
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          df -h
      - run: npx detox build --configuration android.release
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disk-size: 4G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb devices
            adb wait-for-device
            npx detox test --configuration android.ci --headless --record-videos all
          avd-name: rn-sandbox
      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: detox-artifacts-android
          path: artifacts/
          retention-days: 14
