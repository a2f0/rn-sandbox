apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    //   Set to empty list to bundle JS in all builds (needed for Detox without Metro)
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release builds are signed with the Google Play upload key from .secrets/prod/
 * (gitignored; see the README) only when fastlane asks for it with
 * -PrnSandboxUploadSigning=true, passing the keystore it found as
 * -PrnSandboxUploadKeystore and its passwords in ANDROID_KEYSTORE_STORE_PASS
 * and ANDROID_KEYSTORE_KEY_PASS. Otherwise they use the debug key, which
 * Detox's debug-signed test APK needs to instrument them.
 */
def uploadSigning = providers.gradleProperty("rnSandboxUploadSigning").map { it.toBoolean() }.getOrElse(false)
def uploadKeystore = file(providers.gradleProperty("rnSandboxUploadKeystore")
    .getOrElse(rootProject.file("../.secrets/prod/rn-sandbox-upload.keystore").path))
def uploadStorePassword = providers.environmentVariable("ANDROID_KEYSTORE_STORE_PASS").getOrNull()
def uploadKeyPassword = providers.environmentVariable("ANDROID_KEYSTORE_KEY_PASS").getOrNull()
if (uploadSigning && (!uploadKeystore.isFile() || !uploadStorePassword || !uploadKeyPassword)) {
    throw new GradleException("Upload signing needs ${uploadKeystore}, ANDROID_KEYSTORE_STORE_PASS, and ANDROID_KEYSTORE_KEY_PASS.")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sandbox"
    defaultConfig {
        // Permanent once published on Google Play.
        applicationId "net.a2f0.sandbox.rn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Release lanes pass the next Play version code with -PrnSandboxVersionCode=<n>.
        versionCode providers.gradleProperty("rnSandboxVersionCode").map { it.toInteger() }.getOrElse(1)
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // Builds the shared C++ TurboModule; see src/main/jni/CMakeLists.txt.
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
    // Debug builds use the Android Gradle plugin's default debug keystore
    // (~/.android/debug.keystore), which it creates when missing.
    signingConfigs {
        if (uploadSigning) {
            upload {
                storeFile uploadKeystore
                storePassword uploadStorePassword
                keyAlias "rn-sandbox-upload"
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig uploadSigning ? signingConfigs.upload : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Detox
    androidTestImplementation("com.wix:detox:20.51.4")
    androidTestImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test:rules:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
}

// Launcher icons are rendered from assets/brand/*.svg by agent-tool, as the
// android target in agent-tool.json declares (see scripts/build/buildImages.sh), and
// gitignored. Regenerate them whenever the sources, the declaration, or the
// renderer change, before anything reads resources.
def repoRoot = rootProject.layout.projectDirectory.dir("..")
def generateImages = tasks.register("generateImages", Exec) {
    description = "Generates launcher icons from assets/brand/*.svg."
    inputs.files(
        repoRoot.file("agent-tool.json"),
        repoRoot.file("scripts/build/buildImages.sh"),
        repoRoot.file("node_modules/@a2f0/agent-tool/package.json"),
        fileTree(repoRoot.dir("assets/brand")) { include("*.svg") }
    )
    def res = layout.projectDirectory.dir("src/main/res")
    ["mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"].each { density ->
        outputs.dir(res.dir("mipmap-$density"))
    }
    commandLine("sh", repoRoot.file("scripts/build/buildImages.sh").asFile.path, "android")
}
tasks.named("preBuild") { dependsOn(generateImages) }
